<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Aisly – You've been invited!</title>
  <!--
    Old invite links (before Oct 2026) pointed here. This page used to jump
    straight to an aisly:// link, which WhatsApp's built-in browser can't
    open ("You may not have a proper app for viewing this content"). It now
    forwards to the same invite on aisly.co.uk, which opens the app directly
    when it's installed (App Links) and otherwise shows the invite on the web.
  -->
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 24px; padding: 40px 32px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 4px 32px rgba(0,0,0,0.08); }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #1a1a2e; margin: 0 0 8px; }
    p { font-size: 16px; color: #6b7280; margin: 0 0 24px; line-height: 1.5; }
    a.btn { display: block; background: #1D9E75; color: #fff; text-decoration: none; padding: 16px 24px; border-radius: 16px; font-size: 17px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🛒</div>
    <h1>You've been invited!</h1>
    <p>Opening your Aisly invite…</p>
    <a id="open" class="btn" href="https://aisly.co.uk/">Open invite</a>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search);
      var id = q.get('id') || q.get('shareId');
      var target = 'https://aisly.co.uk/';
      if (id) {
        var out = new URLSearchParams();
        ['inviteId', 'email', 'name', 'perm'].forEach(function (k) { if (q.get(k)) out.set(k, q.get(k)); });
        var rest = out.toString();
        target = 'https://aisly.co.uk/shared/' + encodeURIComponent(id) + (rest ? '?' + rest : '');
      }
      document.getElementById('open').href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
